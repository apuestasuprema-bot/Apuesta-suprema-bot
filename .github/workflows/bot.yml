name: Apuesta Suprema Bot

on:
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d "chat_id=@apuestasupremax" -d "text=APUESTA SUPREMA - BOT CONECTADO CORRECTAMENTE"
